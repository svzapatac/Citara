<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Negocio y sedes · Citara</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="Style.css" rel="stylesheet">
</head>
<body>

<div class="d-flex flex-column flex-lg-row">

  <!-- Menú lateral (lo construye menu.js) -->
  <div id="menu-lateral" class="menu-envoltura" data-activo="sedes" data-rol="dueno"></div>

  <main class="contenido p-3 p-lg-4">

    <h1 class="mb-1">Negocio y sedes</h1>
    <p class="text-secondary mb-3">Cada sede tiene su agenda, equipo e inventario.</p>

    <!-- Datos del negocio -->
    <div class="card p-4 mb-3">
      <form class="row g-3 align-items-end">
        <div class="col-12 col-md-4"><label class="form-label" for="negocio">Negocio</label>
          <input id="negocio" class="form-control" value="[Nombre del salón]"></div>
        <div class="col-12 col-md-3"><label class="form-label" for="nit">NIT</label>
          <input id="nit" class="form-control" value="900.123.456-7"></div>
        <div class="col-12 col-md-3"><label class="form-label" for="tel">Teléfono</label>
          <input id="tel" type="tel" class="form-control" value="601 234 5678"></div>
        <div class="col-12 col-md"><button type="button" class="btn btn-outline-primary px-4 w-100">Guardar</button></div>
      </form>
    </div>

    <!-- Sedes -->
    <div class="row g-3">
      <div class="col-12 col-md-6 col-xl-3">
        <div class="card card-borde-azul p-4 h-100">
          <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
            <span class="sede-titulo">Sede principal</span>
            <span class="badge bg-success-subtle text-success-emphasis">Activa</span>
          </div>
          <p class="text-secondary mb-2"><i class="bi bi-geo-alt me-2"></i>Cra. 15 # 85-20, Bogotá</p>
          <p class="mb-2">Lun a sáb · 08:00 a 19:00</p>
          <p class="text-secondary mb-0">4 empleados</p>
        </div>
      </div>

      <div class="col-12 col-md-6 col-xl-3">
        <div class="card p-4 h-100">
          <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
            <span class="sede-titulo">Sede norte</span>
            <span class="badge bg-secondary-subtle text-secondary-emphasis">Ejemplo</span>
          </div>
          <p class="text-secondary mb-2"><i class="bi bi-geo-alt me-2"></i>Dirección por definir</p>
          <p class="mb-2">Lun a sáb · 08:00 a 19:00</p>
          <p class="text-secondary mb-0">0 empleados</p>
        </div>
      </div>

      <div class="col-12 col-xl-6">
        <a href="#" class="caja-punteada h-100 d-flex align-items-center justify-content-center py-4 enlace-fuerte fs-5">
          <i class="bi bi-plus-lg me-2"></i>Agregar sede
        </a>
      </div>
    </div>

  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="menu.js"></script>
</body>
</html>
